# Nodes of this cluster, shared by all its administrators.
all:
  children:
    proxmox_nodes:
      hosts:
        pve1:
          ansible_host: pve1.example.org
        pve2:
          ansible_host: pve2.example.org
        pve3:
          ansible_host: pve3.example.org
      vars:
        # Each administrator's own UNIX account, from PROXMOX_SSH_USER in their .env.
        ansible_user: "{{ lookup('env', 'PROXMOX_SSH_USER') | default('root', true) }}"
        # Privilege escalation can be set per host, if needed:
        # ansible_become: true
